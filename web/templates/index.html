<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMPILE</title>
<link rel="icon" type="image/png" href="{{ asset_url('img/penrose.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ asset_url('css/style.css') }}">
</head>
<body>

<div id="setup-screen" class="screen">
  <div class="setup-card">
    <h1 class="logo">COMPILE</h1>
    <p class="tagline">프로토콜을 컴파일하라.</p>
    <button id="goto-play-setup-btn" class="start-btn">게임 시작</button>
    <button id="codex-btn" class="icon-btn codex-btn-full">Compile Codex</button>
  </div>
</div>

<div id="play-setup-screen" class="screen hidden">
  <div class="setup-card">
    <h1 class="setup-title">게임 설정</h1>

    <p class="setup-step-label">누구와 플레이할까요?</p>
    <div class="mode-select">
      <button class="mode-btn" data-mode="hotseat">
        <span class="mode-title">HOTSEAT</span>
        <span class="mode-desc">한 화면에서 번갈아 플레이</span>
      </button>
      <button class="mode-btn" data-mode="vs_ai">
        <span class="mode-title">VS AI</span>
        <span class="mode-desc">컴퓨터와 대전 (임시 AI)</span>
      </button>
    </div>

    <div id="setup-rest" class="hidden">
      <div id="ai-difficulty-block" class="hidden">
        <p class="setup-step-label">AI 난이도는요?</p>
        <div class="mode-select">
          <button class="mode-btn" data-difficulty="random">
            <span class="mode-title">왕초보</span>
            <span class="mode-desc">완전 무작위</span>
          </button>
          <button class="mode-btn" data-difficulty="heuristic">
            <span class="mode-title">초보</span>
            <span class="mode-desc">카드 가치를 어느 정도 판단함</span>
          </button>
        </div>
      </div>

      <div class="nickname-row">
        <div class="nickname-field">
          <label for="nick-p1">플레이어1 닉네임</label>
          <input type="text" id="nick-p1" maxlength="12" placeholder="플레이어1">
        </div>
        <div class="nickname-field" id="nick-p2-field">
          <label for="nick-p2">플레이어2 닉네임</label>
          <input type="text" id="nick-p2" maxlength="12" placeholder="플레이어2">
        </div>
      </div>

      <p class="setup-step-label">선공은 누구로 할까요?</p>
      <div class="mode-select three">
        <button class="mode-btn small" data-first="1">
          <span class="mode-title" id="first-p1-label">플레이어1</span>
        </button>
        <button class="mode-btn small" data-first="2">
          <span class="mode-title" id="first-p2-label">플레이어2</span>
        </button>
        <button class="mode-btn small selected" data-first="random">
          <span class="mode-title">무작위</span>
        </button>
      </div>

      <p class="setup-step-label">프로토콜은 어떻게 정할까요?</p>
      <div class="mode-select">
        <button class="mode-btn" data-draft="random">
          <span class="mode-title">무작위 배정</span>
          <span class="mode-desc">바로 3+3 무작위 배정</span>
        </button>
        <button class="mode-btn" data-draft="draft">
          <span class="mode-title">밴픽</span>
          <span class="mode-desc">번갈아 픽/밴으로 직접 구성</span>
        </button>
      </div>

      <div class="mode-select set-select hidden" id="set-select">
        <button class="mode-btn small" data-set="main1">
          <span class="mode-title">MAIN 1 + AUX 1</span>
        </button>
        <button class="mode-btn small" data-set="main2">
          <span class="mode-title">MAIN 2 + AUX 2</span>
        </button>
        <button class="mode-btn small" data-set="all">
          <span class="mode-title">전체</span>
        </button>
      </div>

      <label class="toggle-row">
        <input type="checkbox" id="confirm-play-toggle" checked>
        <span>카드 낼 때 확인창 보기</span>
      </label>

      <button id="start-btn" class="start-btn" disabled>시작</button>
    </div>

    <button id="back-to-landing-btn" class="icon-btn codex-btn-full">← 뒤로</button>
  </div>
</div>

<div id="codex-screen" class="screen hidden">
  <header class="topbar">
    <button id="codex-back-btn" class="icon-btn">← 뒤로</button>
    <span class="topbar-title">Compile Codex</span>
    <button id="codex-sidebar-toggle" class="icon-btn hamburger-btn">☰</button>
  </header>

  <div class="codex-tabs">
    <button class="codex-tab selected" data-ctab="codex">카드 구성</button>
    <button class="codex-tab" data-ctab="rules">규칙</button>
  </div>

  <div class="codex-body" id="codex-pane-codex">
    <div id="codex-sidebar-backdrop" class="mobile-drawer-backdrop hidden"></div>
    <aside class="codex-sidebar" id="codex-sidebar">
      <div class="codex-set-select" id="codex-set-select">
        <button class="mode-btn small selected" data-cset="main1">MAIN 1 + AUX 1</button>
        <button class="mode-btn small" data-cset="main2">MAIN 2 + AUX 2</button>
      </div>
      <div class="codex-proto-list" id="codex-proto-list"></div>
    </aside>

    <main class="codex-main">
      <div class="codex-banner" id="codex-banner"></div>
      <div class="codex-cards" id="codex-cards"></div>
    </main>
  </div>

  <div class="rules-body hidden" id="codex-pane-rules">
    <div class="rules-list" id="rules-list"></div>
  </div>
</div>

<div id="draft-screen" class="screen hidden">
  <div class="draft-header">
    <h1 class="draft-title">프로토콜 선택</h1>
    <div class="draft-steps" id="draft-steps"></div>
    <div class="draft-subtitle-row">
      <div class="draft-subtitle" id="draft-subtitle"></div>
      <button id="draft-randomize-btn" class="mode-btn small hidden">🎲 AI 몫 무작위로 정하기</button>
    </div>
  </div>

  <div class="draft-body">
    <div class="draft-side" id="draft-picks-1">
      <div class="draft-side-title">플레이어1</div>
      <div class="draft-picks" id="draft-picks-1-list"></div>
    </div>

    <div class="draft-pool-wrap">
      <div class="draft-pool" id="draft-pool"></div>
    </div>

    <div class="draft-side" id="draft-picks-2">
      <div class="draft-side-title">플레이어2</div>
      <div class="draft-picks" id="draft-picks-2-list"></div>
    </div>
  </div>
</div>

<div id="game-screen" class="screen hidden">
  <header class="topbar">
    <span class="logo-small">COMPILE</span>
    <button id="side-panel-toggle" class="icon-btn hamburger-btn">☰</button>
    <button id="new-game-btn" class="icon-btn" title="새 게임">NEW GAME</button>
  </header>

  <section class="opp-hand-area">
    <div id="opp-hand-cards" class="hand-cards"></div>
  </section>

  <div id="turn-banner" class="turn-banner hidden">
    <div class="turn-banner-text" id="turn-banner-text"></div>
  </div>

  <div class="game-body">
    <main class="board">
      <div class="deck-col">
        <div class="deck-box" id="deck-p2"></div>
        <div class="discard-box" id="discard-p2"></div>
        <div class="deck-col-spacer"></div>
        <div class="deck-box" id="deck-p1"></div>
        <div class="discard-box" id="discard-p1"></div>
      </div>

      <div class="lines-row" id="lines-row"></div>
    </main>

    <div class="control-strip">
      <div id="control-marker" class="control-marker"></div>
    </div>

    <aside class="side-panel">
      <div class="turn-box" id="turn-box"></div>
      <div class="side-panel-collapsible" id="side-panel-collapsible">
        <div class="log-list" id="log-list"></div>
        <div class="card-info-box" id="card-info-box">
          <div class="card-info-empty">카드에 마우스를 올리면<br>여기에 효과가 표시돼요</div>
        </div>
      </div>
      <div id="prompt-bar" class="prompt-bar hidden">
        <div class="prompt-text" id="prompt-text"></div>
        <div class="prompt-actions" id="prompt-actions"></div>
      </div>
    </aside>
  </div>

  <div class="status-bar" id="status-bar"></div>

  <section class="hand-area">
    <div id="hand-cards" class="hand-cards"></div>
  </section>

  <div id="card-zoom" class="card-zoom hidden"></div>

  <div id="pile-modal" class="pile-modal hidden">
    <div class="pile-modal-box">
      <div class="pile-modal-header">
        <span id="pile-modal-title"></span>
        <button id="pile-modal-close" class="icon-btn">닫기</button>
      </div>
      <div class="pile-modal-grid" id="pile-modal-grid"></div>
    </div>
  </div>

  <div id="win-overlay" class="win-overlay hidden">
    <div class="win-card">
      <div class="win-title" id="win-title"></div>
      <button id="win-newgame" class="start-btn">다시 하기</button>
    </div>
  </div>
</div>

<script id="proto-data" type="application/json">
{
  "colors": {{ proto_colors | tojson }},
  "values": {{ proto_values | tojson }},
  "cardText": {{ card_text | tojson }},
  "namesKo": {{ names_ko | tojson }},
  "tagline": {{ proto_tagline | tojson }},
  "verbs": {{ proto_verbs | tojson }},
  "list": {{ proto_list | tojson }},
  "set": {{ proto_set | tojson }}
}
</script>
<script src="{{ asset_url('js/app.js') }}"></script>
</body>
</html>
